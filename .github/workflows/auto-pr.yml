name: Auto Create PR

on:
  push:
    branches-ignore:
      - main
      - stg

permissions:
  pull-requests: write
  contents: read

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create PR if it does not exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 現在のブランチから stg への open な PR が存在するかチェック
          OPEN_PR_COUNT=$(gh pr list --head "$GITHUB_REF_NAME" --base stg --state open --json number --jq 'length')

          if [ "$OPEN_PR_COUNT" -gt 0 ]; then
            echo "An open PR for branch $GITHUB_REF_NAME already exists, skipping."
            exit 0
          fi

          # closed な PR が存在するかチェック (削除されたか単にクローズされたか)
          CLOSED_PR_NUMBER=$(gh pr list --head "$GITHUB_REF_NAME" --base stg --state closed --limit 1 --json number --jq '.[0].number')

          if [ -n "$CLOSED_PR_NUMBER" ] && [ "$CLOSED_PR_NUMBER" != "null" ]; then
            echo "Reopening closed PR #$CLOSED_PR_NUMBER for branch $GITHUB_REF_NAME"
            gh pr reopen "$CLOSED_PR_NUMBER" || echo "Failed to reopen PR, it might be fully merged or deleted."
          else
            echo "Creating PR for branch $GITHUB_REF_NAME"
            gh pr create \
              --base stg \
              --head "$GITHUB_REF_NAME" \
              --title "Auto PR: $GITHUB_REF_NAME" \
              --body "This PR was automatically generated by GitHub Actions upon pushing to the \`$GITHUB_REF_NAME\` branch."
          fi
