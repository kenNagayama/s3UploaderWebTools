name: Auto Create PR

on:
  push:
    branches-ignore:
      - main
      - stg

permissions:
  pull-requests: write
  contents: read

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create PR if it does not exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 現在のブランチから stg への open な PR が存在するかチェック
          PR_EXISTS=$(gh pr list --head "$GITHUB_REF_NAME" --base stg --state open --json number --jq 'length')

          if [ "$PR_EXISTS" -eq 0 ]; then
            echo "Creating PR for branch $GITHUB_REF_NAME"
            gh pr create \
              --base stg \
              --head "$GITHUB_REF_NAME" \
              --title "Auto PR: $GITHUB_REF_NAME" \
              --body "This PR was automatically generated by GitHub Actions upon pushing to the \`$GITHUB_REF_NAME\` branch."
          else
            echo "An open PR for branch $GITHUB_REF_NAME already exists, skipping."
          fi
