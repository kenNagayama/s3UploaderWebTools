name: PR Check (CDK Diff)

on:
  pull_request:
    branches:
      - main
      - stg
    paths:
      - 'infra/**'
      - 'backend/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  cdk-diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Install dependencies
        run: npm install

      - name: Run CDK Diff
        run: npx cdk diff --no-color > ../cdk-diff.log 2>&1 || true

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let diffOutput = "No diff output generated or file not found.";
            if (fs.existsSync('cdk-diff.log')) {
              diffOutput = fs.readFileSync('cdk-diff.log', 'utf8');
              if (diffOutput.length > 60000) {
                diffOutput = diffOutput.substring(0, 60000) + "\n... (Diff output truncated due to size limit)";
              }
            }

            const commentBody = `### CDK Diff Output

            <details>
            <summary>Click to view diff</summary>

            \`\`\`text
            ${diffOutput}
            \`\`\`
            </details>
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            })
